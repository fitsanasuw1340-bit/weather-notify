name: Daily Rain Line Notification

on:
  schedule:
    # รันทุกวันเวลา 07:00 น. เวลาไทย (00:00 UTC)
    - cron: '2 30 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตนเองบน GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run LINE Notification Script
        env:
          LOCATION: "ต.กกสะทอน อ.ด่านซ้าย จ.เลย"
          RAIN_CHANCE: "65"
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python send_line.py
