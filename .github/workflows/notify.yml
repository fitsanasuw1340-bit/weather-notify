name: Daily Rain Notification

on:
  schedule:
    # รันทุกวันเวลา 00:00 UTC (เท่ากับ 07:00 น. เวลาไทย)
    - cron: '0 0 * * *'
  workflow_dispatch: # กดสั่งรันเองจากหน้า GitHub ได้ตลอดเวลา

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Notification Script
        env:
          LOCATION: "ต.กกสะทอน อ.ด่านซ้าย จ.เลย"
          RAIN_CHANCE: "65" # ค่าสมมติ หากเชื่อมต่อ API พยากรณ์อากาศจะดึงค่าจริงให้อัตโนมัติ
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
